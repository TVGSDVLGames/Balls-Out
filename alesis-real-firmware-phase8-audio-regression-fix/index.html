<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alesis Real Firmware Studio Phase 8</title><style>html,body{margin:0;background:#090a0b;color:#ddd;font-family:Arial,sans-serif;min-height:100%}#s{min-height:100vh;display:grid;place-items:center;text-align:center}#bar{width:min(420px,82vw);height:10px;background:#242424;border:1px solid #555;margin:14px auto 8px}#f{height:100%;width:0;background:#77bdd2}</style></head><body><div id="s"><div><b>Loading Phase 8 audio-regression build…</b><div id="bar"><div id="f"></div></div><small id="m">Starting…</small></div></div><script>(async()=>{try{const parts=[];let done=0,total=45;const load=async(path)=>{const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw Error(path+" "+r.status);done++;f.style.width=(done/total*100)+"%";m.textContent=done+" / "+total;return await r.text()};for(let i=0;i<38;i++)parts.push(await load("../alesis-real-firmware-phase3-three-core/chunks/"+String(i).padStart(3,"0")+".txt"));let p6="";for(let i=0;i<5;i++)p6+=await load("../alesis-real-firmware-phase6-advanced-parity/patches/"+String(i).padStart(3,"0")+".txt");const p7=await load("../alesis-real-firmware-phase7-hardware-accuracy/patches/000.txt");const p8=await load("patches/000.txt");let h=parts.join("");if(!h.toLowerCase().startsWith("<!doctype html>"))throw Error("base invalid");for(const k of ["phase3-three-real-firmware","PH3_FW_HR16","PH3_FW_HR16B","PH3_FW_SR16"])if(!h.includes(k))throw Error("wrong Phase 3 core: "+k);h=h.replace("</body></html>",p6+"\n"+p7+"\n"+p8+"\n</body></html>");document.open();document.write(h);document.close()}catch(e){s.innerHTML="<div><b>Load failed</b><br><pre style=\"white-space:pre-wrap\">"+String(e)+"</pre></div>";console.error(e)}})();</script></body></html>
