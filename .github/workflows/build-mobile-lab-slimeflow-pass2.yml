name: Build Mobile Lab - SlimeFlow PASS2

on:
  push:
    branches: [main]
    paths:
      - 'mobile-lab-src/slimeflow/pass2/**'
      - '.github/workflows/build-mobile-lab-slimeflow-pass2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-lab-slimeflow-pass2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct SlimeFlow PASS2 PCK
        shell: bash
        run: |
          set -euo pipefail
          SRC='mobile-lab-src/slimeflow/pass2'
          sha256sum "$SRC"/index.pck.b64.*
          cat "$SRC"/index.pck.b64.* | base64 -d > /tmp/slimeflow-pass2.pck
          test "$(stat -c%s /tmp/slimeflow-pass2.pck)" = "21112"
          echo "dedb32f1907b11e2427aad63fb08f655e51c041d62d8466cb1164649773b6bef  /tmp/slimeflow-pass2.pck" | sha256sum -c -

      - name: Build isolated iPhone web test
        shell: bash
        run: |
          set -euo pipefail
          OUT='web/lab/slimeflow/pass2'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          BASE='https://raw.githubusercontent.com/TVGSDVLGames/Creature-Simulator/main/web'
          for f in index.html index.js index.wasm index.audio.worklet.js index.audio.position.worklet.js index.png index.icon.png index.apple-touch-icon.png; do
            curl -L --fail --retry 3 "$BASE/$f" -o "$OUT/$f"
          done
          cp /tmp/slimeflow-pass2.pck "$OUT/index.pck"
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=Path('web/lab/slimeflow/pass2')
          html=out/'index.html'
          s=html.read_text()
          size=(out/'index.pck').stat().st_size
          s,n=re.subn(r'("index\.pck"\s*:\s*)\d+', rf'\g<1>{size}', s)
          s=re.sub(r'<title>.*?</title>','<title>SLIME FLOW - PASS2 Squish</title>',s,flags=re.S|re.I)
          html.write_text(s)
          print('patched size fields',n,'pck',size)
          PY
          test -s "$OUT/index.html"
          test -s "$OUT/index.wasm"
          test -s "$OUT/index.pck"

      - name: Commit isolated PASS2 build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f web/lab/slimeflow/pass2
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish SlimeFlow PASS2 squish mobile lab'
          git push origin HEAD:main

# rebuild after payload verification
