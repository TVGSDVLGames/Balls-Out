name: Fetch p73 Bowling Animation
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fetch-p73-bowling-animation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/p73-bowling-trigger.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch authored bowling FBX and convert to GLB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p p73-assets/bowling converter
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/trundlr/sbox-sports/736c67423fabdec7a3dd2de64e16d0f6faaea9df/models/SportsCitizen/Animations/Bowling/Citizen_Bowling_Poses.fbx' \
            -o p73-assets/bowling/Citizen_Bowling_Poses.fbx
          curl -L --fail --retry 3 \
            'https://github.com/godotengine/FBX2glTF/releases/download/v0.13.1/FBX2glTF-linux-x86_64.zip' \
            -o converter/fbx2gltf.zip
          unzip -q converter/fbx2gltf.zip -d converter/bin
          BIN="$(find converter/bin -type f -name 'FBX2glTF' | head -n 1)"
          test -n "$BIN"
          chmod +x "$BIN"
          "$BIN" --version || true
          "$BIN" --binary --anim-framerate bake30 --skinning-weights 4 \
            --input p73-assets/bowling/Citizen_Bowling_Poses.fbx \
            --output p73-assets/bowling/Citizen_Bowling_Poses
          python3 - <<'PY'
          import json, struct, pathlib
          p = pathlib.Path('p73-assets/bowling/Citizen_Bowling_Poses.glb')
          data = p.read_bytes()
          magic, version, total = struct.unpack_from('<4sII', data, 0)
          assert magic == b'glTF' and version == 2
          off = 12
          j = None
          while off < len(data):
              ln, typ = struct.unpack_from('<II', data, off); off += 8
              chunk = data[off:off+ln]; off += ln
              if typ == 0x4E4F534A:
                  j = json.loads(chunk.decode('utf-8').rstrip('\x00 '))
          print('GLB animations:', [a.get('name','') for a in j.get('animations',[])])
          print('GLB nodes:', [n.get('name','') for n in j.get('nodes',[])][:160])
          pathlib.Path('p73-assets/bowling/SOURCE.txt').write_text(
              'Source: https://github.com/trundlr/sbox-sports\n'
              'Asset: models/SportsCitizen/Animations/Bowling/Citizen_Bowling_Poses.fbx\n'
              'Pinned commit: 736c67423fabdec7a3dd2de64e16d0f6faaea9df\n'
              'Repository license: MIT\n'
          )
          PY
          ls -lh p73-assets/bowling
      - name: Upload p73 bowling asset
        uses: actions/upload-artifact@v4
        with:
          name: balls-out-p73-bowling-animation
          path: p73-assets
          compression-level: 0
          retention-days: 1
