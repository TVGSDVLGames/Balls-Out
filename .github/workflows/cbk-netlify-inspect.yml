name: CBK Netlify Asset Inspect
on:
  push:
    branches: [cumbackking-web]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cumbackking-web
      - name: Identify existing web pack
        run: |
          echo '=== PROJECT / RESOURCE STRINGS ==='
          strings web/index.pck | grep -E -i 'cum back|comeback|corey|bubble|bobble|balls out|bowling|park_bandstand|head_base|jaw_flaps|chart_v1' | head -120 || true
          echo '=== PACK SIZE ==='
          ls -lh web/index.pck
