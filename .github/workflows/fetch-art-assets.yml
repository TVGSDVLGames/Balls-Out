name: Fetch Balls Out Art Assets
on:
  push:
    paths:
      - '.github/workflows/fetch-art-assets.yml'
  workflow_dispatch:

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Install software-rendering support
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa libxcursor1 libxinerama1 libxi6 libxrandr2 libxrender1

      - name: Fetch real GitHub character assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p art-assets/models/godot-demo art-assets/models/cat-template art-assets/animations art-assets/tools art-assets/materials
          curl -L --fail --retry 3 -o art-assets/models/godot-demo/mannequiny.glb \
            https://raw.githubusercontent.com/godotengine/godot-demo-projects/6ad6167e0577fe3622c18546138f456b107ce93c/3d/ragdoll_physics/characters/mannequiny.glb
          curl -L --fail --retry 3 -o art-assets/models/godot-demo/mannequiny.LICENSE.md \
            https://raw.githubusercontent.com/godotengine/godot-demo-projects/6ad6167e0577fe3622c18546138f456b107ce93c/3d/ragdoll_physics/characters/mannequiny.LICENSE.md

          CAT=https://raw.githubusercontent.com/catprisbrey/Cats-Godot4-Modular-Souls-like-Template/d8bceffc5bf4afe585a3a926fd9aa60ebd26e001
          curl -L --fail --retry 3 -o art-assets/models/cat-template/mannyquin.glb "$CAT/assets/characters/mannyquin.glb"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/minnyquinn.glb "$CAT/assets/characters/minnyquinn.glb"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/masculine_albedo.png "$CAT/assets/characters/masculine_albedo.png"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/masculine_normals.png "$CAT/assets/characters/masculine_normals.png"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/feminine_albedo.png "$CAT/assets/characters/feminine_albedo.png"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/feminine_normals.png "$CAT/assets/characters/feminine_normals.png"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/haircard_albedo.png "$CAT/assets/characters/haircard_albedo.png"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/hair_normals.png "$CAT/assets/characters/hair_normals.png"
          curl -L --fail --retry 3 -o art-assets/models/cat-template/LICENSE "$CAT/LICENSE"
          curl -L --fail --retry 3 -o art-assets/animations/MeleeLib.res "$CAT/player/animation_libraries/MeleeLib.res"

      - name: Fetch real Material Maker 1.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o art-assets/tools/material_maker_1_3_linux.tar.gz \
            https://github.com/RodZill4/material-maker/releases/download/1.3/material_maker_1_3_linux.tar.gz

      - name: Export real Material Maker PBR materials
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p mm
          tar -xzf art-assets/tools/material_maker_1_3_linux.tar.gz -C mm
          MM_BIN=$(find "$GITHUB_WORKSPACE/mm" -type f \( -name 'material_maker.x86_64' -o -name 'material_maker' \) | head -n 1)
          test -n "$MM_BIN"
          chmod +x "$MM_BIN"
          MM_DIR=$(dirname "$MM_BIN")
          cd "$MM_DIR"
          echo "Using actual Material Maker binary: $MM_BIN"
          GODOT_SILENCE_ROOT_WARNING=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a \
            "$MM_BIN" --audio-driver Dummy --video-driver GLES3 \
            --export-material --target "Godot/Godot 4 Standard" -o "$GITHUB_WORKSPACE/art-assets/materials" \
            examples/improved_brick.ptex examples/stone_wall.ptex examples/rusted_metal.ptex examples/wooden_floor.ptex examples/floor1.ptex
          echo '--- REAL MATERIAL MAKER OUTPUT ---'
          find "$GITHUB_WORKSPACE/art-assets/materials" -type f -printf '%P %s bytes\n' | sort
          test "$(find "$GITHUB_WORKSPACE/art-assets/materials" -type f | wc -l)" -gt 5

      - name: Record hashes and provenance
        shell: bash
        run: |
          find art-assets/models -type f -print0 | sort -z | xargs -0 sha256sum > art-assets/MODEL_SHA256SUMS.txt
          sha256sum art-assets/tools/material_maker_1_3_linux.tar.gz > art-assets/MATERIAL_MAKER_SHA256.txt
          cat > art-assets/PROVENANCE.txt <<'EOF'
          Godot mannequiny.glb: godotengine/godot-demo-projects, GDQuest, CC BY 4.0.
          Cat humanoids/textures/animation library: catprisbrey/Cats-Godot4-Modular-Souls-like-Template, commit d8bceffc5bf4afe585a3a926fd9aa60ebd26e001, repository LICENSE is Unlicense/public domain.
          Material Maker: RodZill4/material-maker 1.3 actual Linux release executable, Godot 3.5.2 build.
          Generated materials: exported by the actual Material Maker executable from its bundled .ptex example graphs using target Godot/Godot 4 Standard.
          EOF

      - name: Upload real asset bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: balls-out-art-assets
          path: art-assets/
          compression-level: 0
          retention-days: 1
