name: Fetch Godot 4.2.2
on:
  push:
    paths:
      - '.github/workflows/fetch-godot.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Godot 4.2.2 Linux x86_64
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o Godot_v4.2.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -l Godot_v4.2.2-stable_linux.x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4.2.2-linux
          path: Godot_v4.2.2-stable_linux.x86_64.zip
          compression-level: 0
          retention-days: 1
