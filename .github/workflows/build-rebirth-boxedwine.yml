name: Build ReBirth BoxedWine 384 MiB

on:
  push:
    branches: [boxedwine-runtime]
    paths: [.github/workflows/build-rebirth-boxedwine.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:4.0.16
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v4
        with:
          ref: boxedwine-runtime

      - name: Clone exact BoxedWine 25R1 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch release/25R1 https://github.com/danoon2/Boxedwine.git /tmp/boxedwine-src
          git -C /tmp/boxedwine-src rev-parse HEAD
          grep -n 'TOTAL_MEMORY' /tmp/boxedwine-src/project/emscripten/makefile

      - name: Build fixed 384 MiB variant
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/-s TOTAL_MEMORY=536870912/-s INITIAL_MEMORY=402653184/' /tmp/boxedwine-src/project/emscripten/makefile
          grep -n 'INITIAL_MEMORY' /tmp/boxedwine-src/project/emscripten/makefile
          cd /tmp/boxedwine-src/project/emscripten
          make release
          rm -rf "$GITHUB_WORKSPACE/runtime/rebirth384"
          mkdir -p "$GITHUB_WORKSPACE/runtime/rebirth384"
          cp Build/Release/boxedwine.js Build/Release/boxedwine.wasm "$GITHUB_WORKSPACE/runtime/rebirth384/"

      - name: Verify actual WASM memory and generated engine
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          WASM=Path('runtime/rebirth384/boxedwine.wasm')
          JS=Path('runtime/rebirth384/boxedwine.js')
          b=WASM.read_bytes()
          assert b[:8] == b'\0asm\x01\0\0\0'
          def uleb(i):
              v=0; sh=0
              while True:
                  x=b[i]; i+=1; v|=(x&127)<<sh
                  if not x&128: return v,i
                  sh+=7
          p=8; memories=[]; imported=[]
          while p<len(b):
              sid=b[p]; p+=1; n,p=uleb(p); end=p+n
              if sid==2:
                  count,q=uleb(p)
                  for _ in range(count):
                      ln,q=uleb(q); mod=b[q:q+ln].decode('utf8','replace'); q+=ln
                      ln,q=uleb(q); name=b[q:q+ln].decode('utf8','replace'); q+=ln
                      kind=b[q]; q+=1
                      if kind==0: _,q=uleb(q)
                      elif kind==1:
                          q+=1; flags,q=uleb(q); _,q=uleb(q)
                          if flags&1: _,q=uleb(q)
                      elif kind==2:
                          flags,q=uleb(q); mn,q=uleb(q); mx=None
                          if flags&1: mx,q=uleb(q)
                          imported.append((mod,name,mn,mx,flags))
                      elif kind==3: q+=2
                      elif kind==4: _,q=uleb(q); _,q=uleb(q)
              elif sid==5:
                  count,q=uleb(p)
                  for _ in range(count):
                      flags,q=uleb(q); mn,q=uleb(q); mx=None
                      if flags&1: mx,q=uleb(q)
                      memories.append((mn,mx,flags))
              p=end
          vals=[('import',)+x for x in imported]+[('defined','', '',)+x for x in memories]
          print('Imported memories:', imported)
          print('Defined memories:', memories)
          assert len(imported)+len(memories)==1
          if imported:
              _,_,mn,mx,flags=imported[0]
          else:
              mn,mx,flags=memories[0]
          initial=mn*65536; maximum=None if mx is None else mx*65536
          print('initial bytes=',initial,'maximum bytes=',maximum,'flags=',flags)
          assert initial == 402653184
          assert maximum == 402653184
          assert flags & 2 == 0, 'WASM memory is shared; iPhone Preview would require cross-origin isolation'
          js=JS.read_text(errors='replace')
          assert 'wasmBinary' in js
          print('boxedwine.js bytes=',JS.stat().st_size)
          print('boxedwine.wasm bytes=',WASM.stat().st_size)
          print('Worker constructor references=',js.count('new Worker'))
          print('SharedArrayBuffer references=',js.count('SharedArrayBuffer'))
          PY
          printf 'ReBirth-specific BoxedWine 25R1 web engine. Source: dano​on2/Boxedwine release/25R1. Built with emscripten/emsdk:4.0.16. Upstream fixed 512 MiB WebAssembly memory changed only to fixed 384 MiB (402653184 bytes). WASM memory verified non-shared.\n' > runtime/rebirth384/SOURCE.txt

      - name: Commit custom runtime
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/rebirth384
          git diff --cached --stat
          git commit -m 'Add verified 384 MiB ReBirth BoxedWine 25R1 runtime'
          git push origin HEAD:boxedwine-runtime
