name: Build Bobble40 Web

on:
  push:
    branches: [bobble40-final-live-9]
    paths:
      - '.github/workflows/bobble40-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-final-live-9

      - name: Extract Bubble Bobble source payload
        shell: bash
        run: |
          set -euxo pipefail
          file bobble40-source.tar.xz
          rm -rf src
          mkdir src
          tar -xJf bobble40-source.tar.xz -C src
          find src -maxdepth 3 -type f | sort | head -200
          test -s src/project.godot
          test -s src/scripts/main.gd
          grep -q 'THANK YOU FOR PLAYING' src/scripts/main.gd

      - name: Download Godot 4.7.1 and web templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT=$(find godot-bin -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          TPL="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$TPL"
          unzip -j templates.tpz 'templates/web_nothreads_release.zip' -d "$TPL"
          printf '4.7.1.stable\n' > "$TPL/version.txt"

      - name: Export Bubble Bobble web build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf bobble40-web
          mkdir bobble40-web
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --import --path src
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --path src --export-release Web "$GITHUB_WORKSPACE/bobble40-web/index.html"
          test -s bobble40-web/index.html
          test -s bobble40-web/index.pck
          test -s bobble40-web/index.wasm
          sed -i 's#<title>[^<]*</title>#<title>Bobble40</title>#' bobble40-web/index.html
          grep -q 'Bobble40' bobble40-web/index.html
          ls -lh bobble40-web

      - name: Deploy Bubble Bobble to Netlify
        shell: bash
        run: |
          set -euxo pipefail
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=bobble40-web 2>&1 | tee netlify-output.txt
          URL=$(grep -Eo 'https://[-a-zA-Z0-9.]+\.netlify\.app' netlify-output.txt | tail -n 1)
          test -n "$URL"
          echo "$URL" > BOBBLE40_NETLIFY_URL.txt
          curl -L --fail --retry 5 "$URL" | grep -q 'Bobble40'

      - name: Save Bubble Bobble build and URL
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf bobble40
          mv bobble40-web bobble40
          git add -f bobble40 BOBBLE40_NETLIFY_URL.txt
          git commit -m 'Publish Bubble Bobble 40 web build to Netlify' || exit 0
          git push origin HEAD:bobble40-final-live-9
