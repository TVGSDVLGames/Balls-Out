name: Build Bobble40 Web

on:
  push:
    branches: [bobble40-final-live-9]
    paths:
      - '.github/workflows/bobble40-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-final-live-9

      - name: Reconstruct Bubble Bobble source from verified relay
        shell: bash
        run: |
          set -euxo pipefail
          cat bobble40-relay-final19/f00 bobble40-relay-final19/f01 bobble40-relay-final19/f02 bobble40-relay-final19/f03 bobble40-relay-final19/f04 bobble40-relay-final19/f05 bobble40-relay-final19/f06 bobble40-relay-final19/f07 bobble40-relay-final19/f08 bobble40-relay-final19/f09 bobble40-relay-final19/f10 | tr -cd 'A-Za-z0-9+/=' | base64 -d > bobble40-source-fixed.tar.xz
          xz -t bobble40-source-fixed.tar.xz
          rm -rf src
          mkdir src
          tar -xJf bobble40-source-fixed.tar.xz -C src
          test -s src/project.godot
          test -s src/scripts/main.gd
          grep -q 'THANK YOU FOR PLAYING' src/scripts/main.gd
          grep -qi 'bubble\|bobble' src/project.godot src/scripts/main.gd

      - name: Download Godot 4.7.1 and web templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT=$(find godot-bin -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          TPL="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$TPL"
          unzip -j templates.tpz 'templates/web_nothreads_release.zip' -d "$TPL"
          printf '4.7.1.stable\n' > "$TPL/version.txt"

      - name: Export Bubble Bobble mobile web build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf bobble40-web
          mkdir bobble40-web
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --import --path src
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --path src --export-release Web "$GITHUB_WORKSPACE/bobble40-web/index.html"
          test -s bobble40-web/index.html
          test -s bobble40-web/index.pck
          test -s bobble40-web/index.wasm
          sed -i 's#<title>[^<]*</title>#<title>Bubble Bobble: Big 40!</title>#' bobble40-web/index.html
          grep -q 'Bubble Bobble: Big 40!' bobble40-web/index.html

      - name: Deploy Bubble Bobble to Netlify
        shell: bash
        run: |
          set -euxo pipefail
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=bobble40-web 2>&1 | tee netlify-output.txt
          URL=$(grep -Eo 'https?://[-a-zA-Z0-9.]+\.netlify\.app' netlify-output.txt | tail -n 1)
          test -n "$URL"
          echo "$URL" > BOBBLE40_NETLIFY_URL.txt
          curl -L --fail --retry 5 "$URL" | grep -q 'Bubble Bobble: Big 40!'
          echo "LIVE_URL=$URL"

      - name: Save exact Bubble Bobble build and URL
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf bobble40
          mv bobble40-web bobble40
          git add -f bobble40 BOBBLE40_NETLIFY_URL.txt
          git commit -m 'Publish correct Bubble Bobble 40 mobile web build' || exit 0
          git push origin HEAD:bobble40-final-live-9
