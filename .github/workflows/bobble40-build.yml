name: Build Bobble40 Web

on:
  push:
    branches: [bobble40-build]
    paths:
      - 'bobble40-live-relay2/**'
      - '.github/workflows/bobble40-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct compact 10-round source
        shell: bash
        run: |
          set -euxo pipefail
          : > relay.clean.b64
          for n in $(seq -w 0 19); do
            head -c 19950 "bobble40-live-relay2/r${n}" >> relay.clean.b64
          done
          test "$(stat -c%s relay.clean.b64)" = 399000
          base64 -d relay.clean.b64 > bobble40.tar.xz
          xz -t bobble40.tar.xz
          rm -rf src && mkdir src
          tar -xJf bobble40.tar.xz -C src
          test -s src/project.godot
          test -s src/scripts/main.gd

      - name: Install Godot 4.7.1 and Web templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q godot.zip
          GODOT="$GITHUB_WORKSPACE/Godot_v4.7.1-stable_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          TPL="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$TPL" tpl-unpack
          unzip -q templates.tpz -d tpl-unpack
          cp -a tpl-unpack/templates/. "$TPL/"
          test -s "$TPL/web_nothreads_release.zip"

      - name: Verify demo cut and export Web
        shell: bash
        run: |
          set -euxo pipefail
          grep -Eq 'DEMO_ROUND_COUNT:int *= *10|DEMO_LAST_LEVEL:int *= *9' src/scripts/main.gd
          grep -q 'THANK YOU FOR PLAYING' src/scripts/main.gd
          test "$(find src -type f | grep -Ec '(level|round)[_-]?0?(1[1-9]|[2-9][0-9])' || true)" -eq 0
          rm -rf bobble40-web && mkdir bobble40-web
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --import --path src
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --path src --export-release Web "$GITHUB_WORKSPACE/bobble40-web/index.html"
          test -s bobble40-web/index.html
          test -s bobble40-web/index.pck
          test -s bobble40-web/index.wasm
          sed -i 's#<title>[^<]*</title>#<title>Bobble40</title>#' bobble40-web/index.html

      - name: Deploy exact Bubble Bobble build to Netlify
        id: netlify
        shell: bash
        run: |
          set -euxo pipefail
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=bobble40-web 2>&1 | tee netlify-output.txt
          URL=$(grep -Eo 'https://[-a-zA-Z0-9.]+\.netlify\.app' netlify-output.txt | tail -n 1)
          test -n "$URL"
          echo "$URL" > BOBBLE40_NETLIFY_URL.txt
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -L --fail --retry 5 "$URL" | grep -q 'Bobble40'

      - name: Publish browser files and Netlify URL
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          rm -rf web/bobble40
          mkdir -p web/bobble40
          cp -a bobble40-web/. web/bobble40/
          git add -f web/bobble40 BOBBLE40_NETLIFY_URL.txt
          git commit -m 'Publish Bobble40 10-round web demo to Netlify' || exit 0
          git push
