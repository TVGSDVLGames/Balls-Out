name: Build Bobble40 Web

on:
  push:
    branches: [bobble40-final-live-9]
    paths:
      - '.github/workflows/bobble40-build.yml'
      - 'bobble40-correct-relay/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-final-live-9

      - name: Reconstruct correct Bubble Bobble source
        shell: bash
        run: |
          set -euxo pipefail
          test "$(find bobble40-correct-relay -maxdepth 1 -name 'k*.b64' | wc -l)" -eq 11
          cat bobble40-correct-relay/k00.b64 bobble40-correct-relay/k01.b64 bobble40-correct-relay/k02.b64 bobble40-correct-relay/k03.b64 bobble40-correct-relay/k04.b64 bobble40-correct-relay/k05.b64 bobble40-correct-relay/k06.b64 bobble40-correct-relay/k07.b64 bobble40-correct-relay/k08.b64 bobble40-correct-relay/k09.b64 bobble40-correct-relay/k10.b64 | tr -cd 'A-Za-z0-9+/=' | base64 -d > bobble40-correct-source.tar.xz
          xz -t bobble40-correct-source.tar.xz
          rm -rf src
          mkdir src
          tar -xJf bobble40-correct-source.tar.xz -C src
          test -s src/project.godot
          test -s src/export_presets.cfg
          test -s src/Main.tscn
          test -s src/scripts/main.gd
          grep -q 'THANK YOU FOR PLAYING' src/scripts/main.gd
          grep -qi 'bubble\|bobble' src/project.godot src/scripts/main.gd

      - name: Download Godot 4.7.1 and web templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT=$(find godot-bin -type f -name 'Godot_v4.7.1-stable_linux.x86_64' | head -1)
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          TPL="$HOME/.local/share/godot/export_templates/4.7.1.stable"
          mkdir -p "$TPL"
          unzip -j templates.tpz 'templates/web_nothreads_release.zip' -d "$TPL"
          unzip -j templates.tpz 'templates/web_nothreads_debug.zip' -d "$TPL"
          printf '4.7.1.stable\n' > "$TPL/version.txt"

      - name: Export correct Bubble Bobble mobile web build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf bobble40-web
          mkdir bobble40-web
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --import --path src
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --path src --export-release Web "$GITHUB_WORKSPACE/bobble40-web/index.html"
          test -s bobble40-web/index.html
          test -s bobble40-web/index.pck
          test -s bobble40-web/index.wasm
          sed -i 's#<title>[^<]*</title>#<title>Bubble Bobble: Big 40!</title>#' bobble40-web/index.html
          grep -q 'Bubble Bobble: Big 40!' bobble40-web/index.html

      - name: Commit exact correct browser build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf bobble40
          mv bobble40-web bobble40
          printf 'Bubble Bobble: Big 40! correct mobile browser build\n' > BOBBLE40_BUILD.txt
          git add -f bobble40 BOBBLE40_BUILD.txt
          git commit -m 'Build correct Bubble Bobble 40 mobile web version' || exit 0
          git push origin HEAD:bobble40-final-live-9
