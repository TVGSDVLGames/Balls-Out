name: Fetch Rhythm Lab ROMs

on:
  push:
    paths:
      - '.github/workflows/fetch-rhythm-lab-roms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-roms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify Alesis sample ROMs
        shell: python
        run: |
          from pathlib import Path
          import urllib.request, zlib, json

          base = "https://burnkit2600.com/hr16/"
          specs = {
              "hr16":  (["HR16_U15.BIN","HR16_U16.BIN"], 0xbd375386),
              "hr16b": (["HR16_B_U15.BIN","HR16_B_U16.BIN"], 0xf5e8f90d),
              "sr16":  (["SR16_U5.BIN","SR16_U6.BIN"], 0xf37f8486),
          }

          out = Path("rhythm-lab-pass26/roms")
          out.mkdir(parents=True, exist_ok=True)
          manifest = {}

          for model, (names, expected) in specs.items():
              parts = []
              for name in names:
                  url = base + name
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                  if len(data) != 524288:
                      raise RuntimeError(f"{name}: expected 524288 bytes, got {len(data)}")
                  parts.append(data)

              combos = [parts[0] + parts[1], parts[1] + parts[0]]
              match = next((c for c in combos if (zlib.crc32(c) & 0xffffffff) == expected), None)
              if match is None:
                  got = [hex(zlib.crc32(c) & 0xffffffff) for c in combos]
                  raise RuntimeError(f"{model}: CRC mismatch, got {got}, expected {hex(expected)}")

              (out / f"{model}.bin").write_bytes(match)
              manifest[model] = {
                  "bytes": len(match),
                  "crc32": f"{expected:08x}",
                  "source": names,
              }

          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")

      - name: Commit verified ROM payloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rhythm-lab-pass26/roms
          if git diff --cached --quiet; then
            echo "ROM payloads already current"
            exit 0
          fi
          git commit -m "Add verified Rhythm Lab ROM payloads"
          git push
