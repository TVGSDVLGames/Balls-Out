name: Pennywise64 PASS4 real Tiny3D
on:
  push:
    branches: [pennywise64-pass4-build]
    paths:
      - 'n64/pennywise_pass4/**'
      - '.github/workflows/pennywise64-pass4.yml'
  workflow_dispatch: {}

jobs:
  build-real-n64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      N64_INST: /opt/libdragon
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip xz-utils python3 python3-pip python3-numpy blender libpng-dev zlib1g-dev pkg-config zip libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils
      - name: Official libdragon GCC 16.2 toolchain
        run: |
          wget -q https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb -O /tmp/n64tc.deb
          sudo dpkg -i /tmp/n64tc.deb || sudo apt-get -f install -y
          /opt/libdragon/bin/mips64-elf-gcc --version | head -1
      - name: Build libdragon preview
        run: |
          git clone --depth 1 --branch preview https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          sudo env N64_INST=/opt/libdragon make -j2 install-mk
          env N64_INST=/opt/libdragon make -j2 libdragon tools
          sudo env N64_INST=/opt/libdragon make -j2 install tools-install
      - name: Build Tiny3D and importer
        run: |
          git clone --depth 1 https://github.com/HailToDodongo/tiny3d.git /tmp/tiny3d
          cd /tmp/tiny3d
          env N64_INST=/opt/libdragon make -j2
          sudo env N64_INST=/opt/libdragon make install
          env N64_INST=/opt/libdragon make -C tools/gltf_importer -j2
          sudo env N64_INST=/opt/libdragon make -C tools/gltf_importer install
      - name: Get genuine CC0 humanoid source
        run: |
          mkdir -p /tmp/quaternius
          wget -q https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/night-striker.glb -O /tmp/quaternius/night-striker.glb
          wget -q https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/LICENSE-BASE-CHARACTERS.txt -O /tmp/quaternius/LICENSE.txt
          test -s /tmp/quaternius/night-striker.glb
          test -s /tmp/tiny3d/examples/07_skeleton/assets/box.glb
      - name: Author genuine rigged Pennywise and sewer in Blender
        run: |
          cd n64/pennywise_pass4
          rm -rf assets generated && mkdir -p assets generated
          blender --background --python tools/build_assets_v2.py -- --base /tmp/quaternius/night-striker.glb --out "$PWD/generated" --template-glb /tmp/tiny3d/examples/07_skeleton/assets/box.glb
          cp generated/pennywise.glb assets/pennywise.glb
          cp generated/sewer.glb assets/sewer.glb
          cp generated/balloon.glb assets/balloon.glb
          test -s generated/PENNYWISE_REAL_MESH_PREVIEW.png
          test -s assets/pennywise.glb
          ls -lh assets generated
      - name: Convert assets and build actual ROM
        run: |
          cd n64/pennywise_pass4
          export PATH=/opt/libdragon/bin:$PATH
          make clean
          make -j2
          test -s PENNYWISE64_PASS4.z64
          echo '--- Tiny3D link proof ---'
          /opt/libdragon/bin/mips64-elf-nm build/PENNYWISE64_PASS4.elf | grep -E 't3d_(model|frame|skeleton|viewport)' | head -30
          ls -lh PENNYWISE64_PASS4.z64 build/PENNYWISE64_PASS4.elf filesystem/*.t3dm
      - name: Validation report
        run: |
          cd n64/pennywise_pass4
          {
            echo 'PENNYWISE64 PASS4 REAL TINY3D VALIDATION'
            date -u
            echo
            echo 'Compiler:'
            /opt/libdragon/bin/mips64-elf-gcc --version | head -1
            echo
            echo 'ROM:'
            sha256sum PENNYWISE64_PASS4.z64
            stat -c '%s bytes' PENNYWISE64_PASS4.z64
            echo
            echo 'Real Tiny3D symbols in ELF:'
            /opt/libdragon/bin/mips64-elf-nm build/PENNYWISE64_PASS4.elf | grep -E 't3d_(model_load|model_draw|model_draw_skinned|skeleton_create|skeleton_update|frame_start|viewport)' | head -40
            echo
            echo 'Assets:'
            ls -lh assets/*.glb filesystem/*.t3dm
            echo
            echo 'Source character: Quaternius Universal Base Characters derivative, CC0.'
            echo 'Pennywise body is a genuine skinned humanoid mesh with armature; clown hair/ruff/nose/face paint/cuffs/pompoms are Blender-authored mesh additions bound to its bones.'
            echo 'GLBs contain Tiny3D-compatible Fast64 f3d_mat metadata copied from a known-good Tiny3D example material without executing the Fast64 UI add-on headlessly.'
            echo 'Renderer: libdragon preview RDPQ + Tiny3D RSP microcode. No software rasterizer.'
          } > PASS4_VALIDATION.txt
      - name: Package
        run: |
          cd n64/pennywise_pass4
          rm -rf dist && mkdir -p dist/source
          cp PENNYWISE64_PASS4.z64 dist/
          cp PASS4_VALIDATION.txt dist/
          cp generated/PENNYWISE_REAL_MESH_PREVIEW.png dist/
          cp generated/pennywise_real.blend generated/sewer_real.blend dist/
          cp assets/*.glb dist/
          cp Makefile dist/source/
          cp src/main.c dist/source/
          cp tools/build_assets_v2.py dist/source/
          cp /tmp/quaternius/LICENSE.txt dist/QUATERNIUS_CC0_LICENSE.txt
          (cd dist && zip -r ../Pennywise64_PASS4_REAL_TINY3D.zip .)
      - name: Upload completed PASS4
        uses: actions/upload-artifact@v4
        with:
          name: Pennywise64-PASS4-REAL-Tiny3D
          path: |
            n64/pennywise_pass4/dist/**
            n64/pennywise_pass4/Pennywise64_PASS4_REAL_TINY3D.zip
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pennywise64-PASS4-diagnostics
          path: |
            n64/pennywise_pass4/generated/**
            n64/pennywise_pass4/assets/**
            n64/pennywise_pass4/build/**
            n64/pennywise_pass4/filesystem/**
          if-no-files-found: ignore
