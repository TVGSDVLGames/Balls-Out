name: Virus WASM Proof of Life

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: virus-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone DSP56300 core
        run: |
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/dsp56300/dsp56300.git dsp56300

      - name: Make upstream CMake Emscripten-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dsp56300/source/CMakeLists.txt')
          s=p.read_text()
          s=s.replace('if(WIN32 OR (UNIX AND NOT APPLE))\n\tadd_subdirectory(vtuneSdk)', 'if((WIN32 OR (UNIX AND NOT APPLE)) AND NOT EMSCRIPTEN)\n\tadd_subdirectory(vtuneSdk)')
          p.write_text(s)
          p=Path('dsp56300/source/dsp56kEmu/CMakeLists.txt')
          s=p.read_text()
          s=s.replace('if(WIN32 OR (UNIX AND NOT APPLE))\n\ttarget_link_libraries(dsp56kEmu PUBLIC vtuneSdk)', 'if((WIN32 OR (UNIX AND NOT APPLE)) AND NOT EMSCRIPTEN)\n\ttarget_link_libraries(dsp56kEmu PUBLIC vtuneSdk)')
          s=s.replace('if(UNIX AND NOT APPLE)\n\tset(THREADS_PREFER_PTHREAD_FLAG ON)', 'if(UNIX AND NOT APPLE AND NOT EMSCRIPTEN)\n\tset(THREADS_PREFER_PTHREAD_FLAG ON)')
          p.write_text(s)
          PY

      - name: Configure WASM build
        run: |
          emcmake cmake -S dsp56300 -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDSP56300_DEBUGGER=OFF

      - name: Build DSP interpreter test runner as WASM
        run: cmake --build build-wasm --target dsp56kTestRunner --parallel 3

      - name: Run DSP tests under Node
        run: |
          cd build-wasm/source/dsp56kTestRunner
          node dsp56kTestRunner.js | tee "$GITHUB_WORKSPACE/wasm-test-output.txt"

      - name: Package proof
        if: always()
        shell: bash
        run: |
          mkdir -p virus-wasm-poc
          cp wasm-test-output.txt virus-wasm-poc/ 2>/dev/null || true
          find build-wasm -type f \( -name '*.wasm' -o -name '*.js' \) -print -exec cp {} virus-wasm-poc/ \; 2>/dev/null || true
          cat > virus-wasm-poc/README.txt <<'EOF'
          DSP56300 WEBASSEMBLY PROOF OF LIFE
          ==================================
          First web-port milestone: upstream DSP56300 emulator/test runner
          compiled with Emscripten and executed under Node/WebAssembly.
          No Access Virus firmware is included.
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virus-wasm-poc
          path: virus-wasm-poc
          if-no-files-found: warn
