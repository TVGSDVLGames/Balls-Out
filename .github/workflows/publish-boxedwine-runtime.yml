name: Publish BoxedWine 25R1 Runtime

on:
  push:
    branches:
      - boxedwine-runtime
    paths:
      - .github/workflows/publish-boxedwine-runtime.yml

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated runtime branch
        uses: actions/checkout@v4
        with:
          ref: boxedwine-runtime

      - name: Download official BoxedWine 25R1 web release
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/danoon2/Boxedwine/releases/download/25R1.0/Boxedwine25R1Web.zip \
            -o /tmp/Boxedwine25R1Web.zip
          echo "b10e46bbe8b236d9b8088b3cf8a63d285154763c07d2fc4acb26999e10ad8f7d  /tmp/Boxedwine25R1Web.zip" | sha256sum -c -

      - name: Extract browser runtime
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/bw25 runtime
          mkdir -p /tmp/bw25 runtime
          unzip -q /tmp/Boxedwine25R1Web.zip -d /tmp/bw25
          BOXEDWINE_JS="$(find /tmp/bw25 -type f -name boxedwine.js -print -quit)"
          test -n "$BOXEDWINE_JS"
          WEB_DIR="$(dirname "$BOXEDWINE_JS")"
          echo "Runtime directory: $WEB_DIR"
          find "$WEB_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -f "$WEB_DIR/boxedwine.wasm"
          test -f "$WEB_DIR/boxedwine-shell.js"
          test -f "$WEB_DIR/boxedwine.zip"
          cp -a "$WEB_DIR"/. runtime/
          printf 'Official BoxedWine 25R1 web runtime. Source: dano​on2/Boxedwine release 25R1.0\nSHA256 release ZIP: b10e46bbe8b236d9b8088b3cf8a63d285154763c07d2fc4acb26999e10ad8f7d\n' > runtime/SOURCE.txt

      - name: Audit Wine files needed by ReBirth
        shell: bash
        run: |
          set -euxo pipefail
          unzip -l runtime/boxedwine.zip > /tmp/root-list.txt
          for DLL in kernel32 user32 msvcrt version winmm dsound; do
            echo "=== $DLL ==="
            grep -Ei "(^|/)$DLL(\\.dll|\\.dll\\.so)(/|$)" /tmp/root-list.txt | head -20
            grep -Eqi "(^|/)$DLL(\\.dll|\\.dll\\.so)(/|$)" /tmp/root-list.txt
          done
          echo '=== all wineboot / registry / prefix matches ==='
          grep -Ei 'wineboot|wineserver|/wine$|system\\.reg|user\\.reg|userdef\\.reg' /tmp/root-list.txt | head -150 || true
          echo '=== Wine audio-related matches ==='
          grep -Ei '(wineoss|winealsa|winepulse|winecoreaudio|mmdevapi|winebus|alsa|pulse|oss|audio|dsound|winmm)' /tmp/root-list.txt | head -200 || true

      - name: Audit browser engine sidecars and WASM memory
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== worker / shared-memory references ==='
          if grep -En 'PThread|SharedArrayBuffer|new Worker|worker\\.js|importScripts|Atomics\\.' runtime/boxedwine.js; then
            echo 'Unexpected worker/shared-memory dependency found'
            exit 1
          else
            echo 'No pthread/worker/shared-memory sidecar dependency found'
          fi
          echo '=== other possible generated sidecars ==='
          grep -Eo "[A-Za-z0-9_.-]+\\.(data|mem|worker\\.js|wasm)" runtime/boxedwine.js | sort -u || true
          python3 - <<'PY'
          from pathlib import Path
          b = Path('runtime/boxedwine.wasm').read_bytes()
          assert b[:4] == b'\\0asm' and b[4:8] == b'\\x01\\x00\\x00\\x00'
          p = 8
          def uleb(i):
              v = 0; sh = 0
              while True:
                  x = b[i]; i += 1
                  v |= (x & 0x7f) << sh
                  if not (x & 0x80): return v, i
                  sh += 7
          memories=[]
          imports=[]
          while p < len(b):
              sid=b[p]; p+=1
              n,p=uleb(p); end=p+n
              if sid==2:  # imports
                  count,p2=uleb(p)
                  for _ in range(count):
                      ln,p2=uleb(p2); mod=b[p2:p2+ln].decode('utf8','replace'); p2+=ln
                      ln,p2=uleb(p2); name=b[p2:p2+ln].decode('utf8','replace'); p2+=ln
                      kind=b[p2]; p2+=1
                      if kind==0: _,p2=uleb(p2)
                      elif kind==1:
                          p2 += 1
                          flags,p2=uleb(p2); _,p2=uleb(p2)
                          if flags & 1: _,p2=uleb(p2)
                      elif kind==2:
                          flags,p2=uleb(p2); mn,p2=uleb(p2); mx=None
                          if flags & 1: mx,p2=uleb(p2)
                          imports.append((mod,name,mn,mx,flags))
                      elif kind==3:
                          p2 += 2
                      elif kind==4:
                          _,p2=uleb(p2); _,p2=uleb(p2)
              elif sid==5:  # memory section
                  count,p2=uleb(p)
                  for _ in range(count):
                      flags,p2=uleb(p2); mn,p2=uleb(p2); mx=None
                      if flags & 1: mx,p2=uleb(p2)
                      memories.append((mn,mx,flags))
              p=end
          print('Imported memories:', imports)
          print('Defined memories:', memories)
          assert len(imports)+len(memories) == 1, 'Expected exactly one WebAssembly memory'
          mem=(imports+memories)[0]
          mn=mem[2] if imports else mem[0]
          mx=mem[3] if imports else mem[1]
          print('Initial memory pages:', mn, 'bytes:', mn*65536, 'MiB:', mn*65536/1048576)
          print('Maximum memory pages:', mx, 'bytes:', None if mx is None else mx*65536, 'MiB:', None if mx is None else mx*65536/1048576)
          PY

      - name: Commit runtime files to this branch only
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime
          if ! git diff --cached --quiet; then
            git commit -m "Publish official BoxedWine 25R1 web runtime"
            git push origin HEAD:boxedwine-runtime
          fi

      - name: Verify raw runtime is browser-fetchable
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://raw.githubusercontent.com/TVGSDVLGames/Balls-Out/boxedwine-runtime/runtime'
          for FILE in boxedwine.js boxedwine-shell.js boxedwine.wasm boxedwine.zip; do
            OK=0
            for TRY in 1 2 3 4 5; do
              curl -fsSL --retry 2 -D "/tmp/${FILE}.headers" -o "/tmp/${FILE}.check" "$BASE/$FILE" || true
              if test -s "/tmp/${FILE}.check" && grep -qi '^access-control-allow-origin: \*' "/tmp/${FILE}.headers"; then
                OK=1
                break
              fi
              sleep 3
            done
            test "$OK" = 1
            echo "$FILE bytes: $(wc -c < "/tmp/${FILE}.check")"
            grep -i '^access-control-allow-origin:' "/tmp/${FILE}.headers"
            grep -i '^content-type:' "/tmp/${FILE}.headers" || true
            grep -i '^x-content-type-options:' "/tmp/${FILE}.headers" || true
          done
          test "$(wc -c < /tmp/boxedwine.wasm.check)" -eq 2303715
          test "$(wc -c < /tmp/boxedwine.zip.check)" -eq 37247698