name: Build Virus Standalone

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4

      - name: Install Gearmulator Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev ninja-build zip

      - name: Clone Gearmulator 2.2.9
        run: |
          git clone --recursive --depth 1 --branch 2.2.9 \
            https://github.com/dsp56300/gearmulator.git gearmulator

      - name: Configure Osirus standalone only
        run: |
          cmake -S gearmulator -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dgearmulator_BUILD_JUCEPLUGIN=ON \
            -Dgearmulator_BUILD_JUCEPLUGIN_VST2=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_VST3=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_CLAP=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_LV2=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_AU=OFF \
            -Dgearmulator_BUILD_JUCEPLUGIN_Standalone=ON \
            -Dgearmulator_BUILD_FX_PLUGIN=OFF \
            -Dgearmulator_SYNTH_OSIRUS=ON \
            -Dgearmulator_SYNTH_OSTIRUS=OFF \
            -Dgearmulator_SYNTH_VAVRA=OFF \
            -Dgearmulator_SYNTH_XENIA=OFF \
            -Dgearmulator_SYNTH_NODALRED2X=OFF \
            -Dgearmulator_SYNTH_JE8086=OFF

      - name: Build Osirus standalone
        run: cmake --build build --config Release --target osirusJucePlugin_Standalone --parallel 3

      - name: Find standalone binary
        id: findbin
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(find gearmulator/bin build -type f -name 'Osirus' -perm -111 2>/dev/null | head -n 1 || true)"
          if [[ -z "$BIN" ]]; then
            echo "Osirus executable not found"
            find build gearmulator/bin -maxdepth 8 -type f | sort | tail -400
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"
          file "$BIN"
          ldd "$BIN" || true

      - name: Package one-folder app
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/Access-Virus-C-Linux"
          mkdir -p "$OUT/roms"
          cp "${{ steps.findbin.outputs.bin }}" "$OUT/Osirus"
          chmod +x "$OUT/Osirus"

          cat > "$OUT/START_VIRUS.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          BASE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$BASE"
          shopt -s nullglob
          roms=(roms/*.bin roms/*.mid)
          if (( ${#roms[@]} == 0 )); then
            if command -v kdialog >/dev/null 2>&1; then
              kdialog --error "Put your Access Virus A/B/C firmware (.bin or .mid) in the roms folder, then start again." --title "Access Virus C"
            else
              echo "Put your Access Virus A/B/C firmware (.bin or .mid) in: $BASE/roms"
            fi
            exit 2
          fi
          for r in "${roms[@]}"; do cp -f "$r" "$BASE/"; done
          exec "$BASE/Osirus"
          EOF
          chmod +x "$OUT/START_VIRUS.sh"

          cat > "$OUT/INSTALL_DESKTOP.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          BASE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          DESK="$HOME/.local/share/applications/access-virus-c.desktop"
          mkdir -p "$(dirname "$DESK")"
          cat > "$DESK" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Access Virus C
          Comment=Firmware-level Access Virus A/B/C emulation
          Exec=$BASE/START_VIRUS.sh
          Path=$BASE
          Terminal=false
          Categories=AudioVideo;Audio;Music;
          StartupNotify=true
          DESKTOP
          chmod +x "$DESK"
          echo "Installed application-menu entry: Access Virus C"
          EOF
          chmod +x "$OUT/INSTALL_DESKTOP.sh"

          cat > "$OUT/README.txt" <<'EOF'
          ACCESS VIRUS C — LINUX STANDALONE
          =================================

          This is the real Gearmulator/Osirus low-level emulator build.
          It runs compatible original Access Virus A/B/C firmware on the
          emulated DSP56300 hardware; it is not a soundalike synth engine.

          QUICK START
          1. Put your legally obtained Virus C firmware in the roms folder.
             Accepted by Osirus: a 512 KB .bin ROM or compatible Access OS .mid.
          2. Double-click START_VIRUS.sh and choose Execute/Run.
          3. Optional: run INSTALL_DESKTOP.sh once to add Access Virus C to
             your Linux application menu.

          No Access firmware is included.
          Target firmware: Virus C OS 6.5 is recommended.
          EOF

          printf 'No Access firmware is included. Put firmware here.\n' > "$OUT/roms/PUT_VIRUS_ROM_HERE.txt"
          chmod -R a+rX "$OUT"
          (cd "$GITHUB_WORKSPACE" && zip -r Access-Virus-C-Linux.zip Access-Virus-C-Linux)

      - name: Smoke-check package
        run: |
          test -x Access-Virus-C-Linux/Osirus
          test -x Access-Virus-C-Linux/START_VIRUS.sh
          file Access-Virus-C-Linux/Osirus
          bash -n Access-Virus-C-Linux/START_VIRUS.sh
          bash -n Access-Virus-C-Linux/INSTALL_DESKTOP.sh

      - name: Upload Virus standalone
        uses: actions/upload-artifact@v4
        with:
          name: Access-Virus-C-Linux
          path: Access-Virus-C-Linux.zip
          if-no-files-found: error
          retention-days: 30
