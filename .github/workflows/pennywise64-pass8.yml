name: Pennywise64 PASS8 Turok Doom64 visual correction
on:
  push:
    branches: [pennywise64-pass8-turok-doom64]
    paths:
      - 'n64/pennywise_pass5/**'
      - '.github/workflows/pennywise64-pass8.yml'
  workflow_dispatch: {}

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      N64_INST: /opt/libdragon
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl unzip xz-utils python3 python3-pip python3-numpy blender libpng-dev zlib1g-dev pkg-config zip libegl1 libgl1 libglx-mesa0 libopengl0 mesa-utils xvfb imagemagick libasound2t64 libudev1 libx11-6 libxext6 libxrandr2 libxi6 libxcursor1 libxinerama1 libwayland-client0 libvulkan1 mesa-vulkan-drivers
      - name: Official libdragon GCC toolchain
        run: |
          wget -q https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb -O /tmp/n64tc.deb
          sudo dpkg -i /tmp/n64tc.deb || sudo apt-get -f install -y
      - name: Build libdragon preview
        run: |
          git clone --depth 1 --branch preview https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          sudo env N64_INST=/opt/libdragon make -j2 install-mk
          env N64_INST=/opt/libdragon make -j2 libdragon tools
          sudo env N64_INST=/opt/libdragon make -j2 install tools-install
      - name: Build Tiny3D and importer
        run: |
          git clone --depth 1 https://github.com/HailToDodongo/tiny3d.git /tmp/tiny3d
          cd /tmp/tiny3d
          env N64_INST=/opt/libdragon make -j2
          sudo env N64_INST=/opt/libdragon make install
          env N64_INST=/opt/libdragon make -C tools/gltf_importer -j2
          sudo env N64_INST=/opt/libdragon make -C tools/gltf_importer install
      - name: Get genuine CC0 humanoid and Tiny3D material template
        run: |
          mkdir -p /tmp/quaternius
          wget -q https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/night-striker.glb -O /tmp/quaternius/night-striker.glb
          wget -q https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/main/public/assets/vendor/quaternius/LICENSE-BASE-CHARACTERS.txt -O /tmp/quaternius/LICENSE.txt
          test -s /tmp/tiny3d/examples/07_skeleton/assets/box.glb
      - name: Generate PASS8 source
        run: |
          cd n64/pennywise_pass5
          python3 tools/make_pass8_source.py
          test -s tools/build_assets_pass8.py
          test -s src/main_pass8.c
          test -s src/main_pass8_bossproof.c
          grep -q 'PennyHead' tools/build_assets_pass8.py
          grep -q 'PASS8_SKIP' tools/build_assets_pass8.py
          grep -q 'SewerLampCyan' tools/build_assets_pass8.py
          grep -q 'BossRedGlow' tools/build_assets_pass8.py
          grep -q 't3d_light_set_exposure(1.35f)' src/main_pass8.c
          grep -q 't3d_fog_set_range(340.0f, 900.0f)' src/main_pass8.c
          grep -q 'PENNYWISE64_PASS8' Makefile
      - name: Author PASS8 assets and textures
        run: |
          cd n64/pennywise_pass5
          rm -rf assets generated && mkdir -p assets generated
          blender --background --python tools/build_assets_pass8.py -- --base /tmp/quaternius/night-striker.glb --out "$PWD/generated" --template-glb /tmp/tiny3d/examples/07_skeleton/assets/box.glb
          for f in pennywise sewer balloon slingshot grate; do test -s "generated/$f.glb"; cp "generated/$f.glb" assets/; done
          for f in brick stone metal water cloth redcloth skin hair wood face; do test -s "generated/$f.png"; cp "generated/$f.png" assets/; done
          test -s generated/PENNYWISE_PASS8_MODEL_PREVIEW.png
          test -s generated/pennywise_pass8.blend
          test -s generated/sewer_pass8.blend
      - name: Validate PASS8 model and environment change
        run: |
          cd n64/pennywise_pass5
          python3 - <<'PY'
          import struct,json,glob,os
          def doc(path):
              b=open(path,'rb').read();off=12
              while off<len(b):
                  ln,t=struct.unpack_from('<II',b,off);off+=8;d=b[off:off+ln];off+=ln
                  if t==0x4E4F534A:return json.loads(d.rstrip(b' \0\r\n\t').decode())
          p=doc('assets/pennywise.glb'); names=' '.join(n.get('name','') for n in p.get('nodes',[]))
          assert 'PennyHead' in names
          for bad in ['TunicUpper','TunicLower','SleevePuffL','BloomerL','PennyFacePatch']:
              assert bad not in names,(bad,names)
          assert 'SuperHero_Male' in names
          s=doc('assets/sewer.glb'); sn=' '.join(n.get('name','') for n in s.get('nodes',[]))
          for marker in ['CyanGuide','BossGlowV','BossGlowH','BossDrainArch','AlcoveDark','LadderRail','CrossPipe']:
              assert marker in sn,marker
          print('PASS8_PENNY_NODES',len(p.get('nodes',[])),'PASS8_SEWER_NODES',len(s.get('nodes',[])))
          PY
          identify generated/PENNYWISE_PASS8_MODEL_PREVIEW.png
      - name: Convert Tiny3D assets and build PASS8 ROM
        run: |
          cd n64/pennywise_pass5
          export PATH=/opt/libdragon/bin:$PATH
          make clean
          make -j2
          test -s PENNYWISE64_PASS8.z64
          test $(find filesystem -name '*.sprite' | wc -l) -ge 10
          ls -lh filesystem/*.sprite filesystem/*.t3dm PENNYWISE64_PASS8.z64
      - name: Validate PASS8 ROM
        run: |
          cd n64/pennywise_pass5
          python3 - <<'PY'
          import hashlib
          rom=open('PENNYWISE64_PASS8.z64','rb').read()
          assert rom[:4]==bytes.fromhex('80371240')
          title=rom[0x20:0x34].decode('ascii','replace').rstrip('\0 ')
          assert 'PENNYWISE 64 P8' in title,title
          print(title,len(rom),hashlib.sha256(rom).hexdigest())
          PY
          cp PENNYWISE64_PASS8.z64 /tmp/PENNYWISE64_PASS8_MAIN.z64
      - name: Build boss-proof capture ROM from same PASS8 assets
        run: |
          cd n64/pennywise_pass5
          python3 - <<'PY'
          p='Makefile'; s=open(p).read()
          s=s.replace('BUILD_DIR=build','BUILD_DIR=build_boss',1)
          s=s.replace('src = src/main_pass8.c','src = src/main_pass8_bossproof.c',1)
          s=s.replace('PENNYWISE64_PASS8','PENNYWISE64_PASS8_BOSS')
          s=s.replace('PENNYWISE 64 P8','PENNYWISE 64 P8B')
          open('Makefile.boss','w').write(s)
          PY
          export PATH=/opt/libdragon/bin:$PATH
          make -f Makefile.boss -j2
          test -s PENNYWISE64_PASS8_BOSS.z64
      - name: Get Gopher64
        run: |
          wget -q https://github.com/gopher64/gopher64/releases/download/v1.1.36/gopher64-linux-x86_64 -O /tmp/gopher64
          chmod +x /tmp/gopher64
          mkdir -p /tmp/gopher-portable && cp /tmp/gopher64 /tmp/gopher-portable/ && touch /tmp/gopher-portable/portable.txt
          cat >/tmp/asound.conf <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF
      - name: Gopher64 exact main-ROM capture
        run: |
          cd n64/pennywise_pass5
          export ALSA_CONFIG_PATH=/tmp/asound.conf SDL_AUDIODRIVER=dummy DISPLAY=:99
          Xvfb :99 -screen 0 800x600x24 -nolisten tcp >/tmp/xvfb-main.log 2>&1 & XVFB_PID=$!
          sleep 2
          cd /tmp/gopher-portable
          timeout --signal=TERM --kill-after=2s 13s ./gopher64 "$GITHUB_WORKSPACE/n64/pennywise_pass5/PENNYWISE64_PASS8.z64" >/tmp/gopher-main.log 2>&1 & EMU=$!
          sleep 8
          test -e /proc/$EMU/status
          import -display :99 -window root "$GITHUB_WORKSPACE/n64/pennywise_pass5/PENNYWISE64_PASS8_GOPHER64.png"
          wait "$EMU" || true
          kill "$XVFB_PID" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/n64/pennywise_pass5"
          { tail -180 /tmp/gopher-main.log || true; } > PASS8_SMOKE_MAIN.txt
          if grep -Eqi 'assertion failed|assert failed|backtrace|panic|segmentation fault|not found' PASS8_SMOKE_MAIN.txt; then cat PASS8_SMOKE_MAIN.txt; exit 1; fi
          test -s PENNYWISE64_PASS8_GOPHER64.png
          echo -n 'START_FRAME_MEAN=' > PASS8_BRIGHTNESS.txt
          convert PENNYWISE64_PASS8_GOPHER64.png -colorspace Gray -format '%[fx:mean]' info: >> PASS8_BRIGHTNESS.txt
          echo >> PASS8_BRIGHTNESS.txt
          cat PASS8_BRIGHTNESS.txt
      - name: Gopher64 actual in-engine Pennywise boss capture
        run: |
          cd n64/pennywise_pass5
          export ALSA_CONFIG_PATH=/tmp/asound.conf SDL_AUDIODRIVER=dummy DISPLAY=:100
          Xvfb :100 -screen 0 800x600x24 -nolisten tcp >/tmp/xvfb-boss.log 2>&1 & XVFB_PID=$!
          sleep 2
          cd /tmp/gopher-portable
          timeout --signal=TERM --kill-after=2s 13s ./gopher64 "$GITHUB_WORKSPACE/n64/pennywise_pass5/PENNYWISE64_PASS8_BOSS.z64" >/tmp/gopher-boss.log 2>&1 & EMU=$!
          sleep 8
          test -e /proc/$EMU/status
          import -display :100 -window root "$GITHUB_WORKSPACE/n64/pennywise_pass5/PENNYWISE64_PASS8_BOSS_GOPHER64.png"
          wait "$EMU" || true
          kill "$XVFB_PID" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/n64/pennywise_pass5"
          { tail -180 /tmp/gopher-boss.log || true; } > PASS8_SMOKE_BOSS.txt
          if grep -Eqi 'assertion failed|assert failed|backtrace|panic|segmentation fault|not found' PASS8_SMOKE_BOSS.txt; then cat PASS8_SMOKE_BOSS.txt; exit 1; fi
          test -s PENNYWISE64_PASS8_BOSS_GOPHER64.png
      - name: PASS8 validation report
        run: |
          cd n64/pennywise_pass5
          {
            echo 'PENNYWISE64 PASS8 - TUROK READABILITY / DOOM64 MOOD VISUAL REBUILD'
            date -u
            sha256sum PENNYWISE64_PASS8.z64
            stat -c '%s bytes' PENNYWISE64_PASS8.z64
            echo '- brighter 32x32 N64 texture palette and larger UV cadence'
            echo '- fog pushed back to preserve visibility; brighter teal fog color'
            echo '- two directional lights + 1.35 exposure instead of crushed black scene'
            echo '- real skinned humanoid is now the core Pennywise silhouette; bulky primitive costume shells removed'
            echo '- tapered 12-sided textured clown head replaces rectangular face patch'
            echo '- idle/walk/attack/hurt animation keys rebuilt to eliminate bind-pose T arms'
            echo '- cyan sewer guide lights + red boss chamber light strips + stronger landmarks'
            echo '- exact main ROM and boss-proof ROM both emulator captured'
            cat PASS8_BRIGHTNESS.txt
          } > PASS8_VALIDATION.txt
      - name: Package PASS8
        run: |
          cd n64/pennywise_pass5
          rm -rf dist && mkdir -p dist/source dist/textures
          cp /tmp/PENNYWISE64_PASS8_MAIN.z64 dist/PENNYWISE64_PASS8.z64
          cp PASS8_VALIDATION.txt PASS8_BRIGHTNESS.txt PASS8_SMOKE_MAIN.txt PASS8_SMOKE_BOSS.txt dist/
          cp PENNYWISE64_PASS8_GOPHER64.png PENNYWISE64_PASS8_BOSS_GOPHER64.png dist/
          cp generated/PENNYWISE_PASS8_MODEL_PREVIEW.png dist/
          cp generated/pennywise_pass8.blend generated/sewer_pass8.blend dist/
          cp assets/*.glb dist/
          cp assets/*.png dist/textures/
          cp Makefile src/main_pass8.c src/main_pass8_bossproof.c tools/build_assets_pass8.py tools/make_pass8_source.py tools/pass7_materials.py dist/source/
          cp /tmp/quaternius/LICENSE.txt dist/QUATERNIUS_CC0_LICENSE.txt
          (cd dist && zip -r ../Pennywise64_PASS8_TUROK_DOOM64.zip .)
      - name: Upload PASS8
        uses: actions/upload-artifact@v4
        with:
          name: Pennywise64-PASS8-TUROK-DOOM64
          path: |
            n64/pennywise_pass5/dist/**
            n64/pennywise_pass5/Pennywise64_PASS8_TUROK_DOOM64.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pennywise64-PASS8-diagnostics
          path: |
            n64/pennywise_pass5/generated/**
            n64/pennywise_pass5/assets/**
            n64/pennywise_pass5/build/**
            n64/pennywise_pass5/build_boss/**
            n64/pennywise_pass5/filesystem/**
            n64/pennywise_pass5/*.png
            n64/pennywise_pass5/PASS8_*.txt
          if-no-files-found: ignore
