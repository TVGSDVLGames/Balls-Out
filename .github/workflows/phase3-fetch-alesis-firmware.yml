name: Phase3 Fetch Alesis Firmware
on:
  push:
    paths:
      - ".github/workflows/phase3-fetch-alesis-firmware.yml"
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 "https://burnkit2600.com/hr16/HR16_B_V2_00.BIN" -o out/HR16_B_V2_00.BIN
          curl -fL --retry 3 "https://burnkit2600.com/hr16/SR16_V1_04.BIN" -o out/SR16_V1_04.BIN
          test "$(stat -c%s out/HR16_B_V2_00.BIN)" = "32768"
          test "$(stat -c%s out/SR16_V1_04.BIN)" = "65536"
          echo "f8b3786b32d68e3627a654b8b3916befbe9bc540  out/HR16_B_V2_00.BIN" | sha1sum -c -
          echo "0bbeb4bd25e33a9eca64d5a31480f96a0040617e  out/SR16_V1_04.BIN" | sha1sum -c -
          sha1sum out/*
      - name: Upload verified firmware
        uses: actions/upload-artifact@v4
        with:
          name: alesis-phase3-firmware
          path: out/
          retention-days: 1
