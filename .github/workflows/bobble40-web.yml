name: Build Correct Bobble40 Public Web

on:
  push:
    branches: [bobble40-build]
    paths:
      - '.github/workflows/bobble40-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bobble40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-build
      - name: Diagnose relay lengths
        shell: bash
        run: |
          set -euxo pipefail
          for i in {00..20}; do
            n=$(tr -d '\r\n' < "bobble40-live-relay2/r$i" | wc -c)
            echo "r$i=$n"
          done
          exit 1
