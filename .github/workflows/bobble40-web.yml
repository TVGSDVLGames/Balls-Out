name: Check Bobble40 Relay
on:
  push:
    branches: [bobble40-build]
    paths: ['.github/workflows/bobble40-web.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-build
      - shell: bash
        run: |
          set -x
          for i in 09 15 19; do tr -d '\r\n' < bobble40-live-relay2/r$i | head -c 19950 | sha256sum; done
          exit 1
