name: Build Correct Bobble40 Public Web

on:
  push:
    branches: [bobble40-build]
    paths:
      - '.github/workflows/bobble40-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bobble40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-build

      - name: Recover actual Bubble Bobble source
        shell: bash
        run: |
          set -euxo pipefail
          cat bobble40-live-relay2/r* | tr -cd 'A-Za-z0-9+/' > relay.clean
          REM=$(( $(wc -c < relay.clean) % 4 ))
          if [ "$REM" -eq 2 ]; then printf '==' >> relay.clean; elif [ "$REM" -eq 3 ]; then printf '=' >> relay.clean; elif [ "$REM" -eq 1 ]; then echo 'invalid relay length' >&2; exit 1; fi
          base64 -d relay.clean > bobble40.tar.xz
          rm -rf bobble40-src
          mkdir bobble40-src
          tar -xJf bobble40.tar.xz -C bobble40-src
          PROJ=$(find bobble40-src -name project.godot -print -quit)
          test -n "$PROJ"
          PROJDIR=$(dirname "$PROJ")
          echo "$PROJDIR" > project-dir.txt
          test -s "$PROJDIR/scripts/main.gd"
          grep -q 'DEMO_LAST_LEVEL' "$PROJDIR/scripts/main.gd"
          grep -q 'THANK YOU FOR PLAYING' "$PROJDIR/scripts/main.gd"
          grep -q '_build_mobile_controls' "$PROJDIR/scripts/main.gd"

      - name: Download Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          GODOT=$(find godot-bin -type f -name 'Godot_v4.7.1-stable_linux.x86_64' -print -quit)
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "$GODOT" > godot-path.txt

      - name: Build Bubble Bobble PCK
        shell: bash
        run: |
          set -euxo pipefail
          GODOT=$(cat godot-path.txt)
          PROJDIR=$(cat project-dir.txt)
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --import --path "$PROJDIR"
          rm -rf bobble40-public
          mkdir bobble40-public
          GODOT_SILENCE_ROOT_WARNING=1 "$GODOT" --headless --path "$PROJDIR" --export-pack Web "$GITHUB_WORKSPACE/bobble40-public/index.pck"
          test -s bobble40-public/index.pck

      - name: Add generic Godot browser runtime
        shell: bash
        run: |
          set -euxo pipefail
          for f in index.html index.js index.wasm index.audio.worklet.js index.audio.position.worklet.js index.png index.icon.png index.apple-touch-icon.png; do cp "web/$f" "bobble40-public/$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('bobble40-public/index.html')
          s=p.read_text()
          size=Path('bobble40-public/index.pck').stat().st_size
          s,n=re.subn(r'("index\\.pck"\\s*:\\s*)\\d+',rf'\\g<1>{size}',s)
          if n != 1: raise SystemExit(f'PCK size patch count={n}')
          s=re.sub(r'<title>.*?</title>','<title>Bobble40</title>',s,flags=re.S)
          if 'viewport-fit=cover' not in s: s=s.replace('width=device-width, user-scalable=no, initial-scale=1.0','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover')
          p.write_text(s)
          PY

      - name: Publish public no-password build
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          rm -rf bobble40
          mv bobble40-public bobble40
          git add -f bobble40
          git commit -m 'Publish correct Bubble Bobble Big 40 mobile web build'
          git push origin HEAD:bobble40-build
