name: Deploy Bobble40 Mobile Web

on:
  push:
    branches: [bobble40-build]
    paths:
      - '.github/workflows/bobble40-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-bobble40:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bobble40-build

      - name: Verify exact compiled Bubble Bobble web build
        shell: bash
        run: |
          set -euxo pipefail
          test -s web/index.html
          test -s web/index.js
          test -s web/index.wasm
          test -s web/index.pck
          test "$(stat -c%s web/index.wasm)" = 39513091
          test "$(stat -c%s web/index.pck)" = 8653864
          rm -rf bobble40-live
          cp -a web bobble40-live
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('bobble40-live/index.html')
          s=p.read_text()
          s=re.sub(r'<title>.*?</title>','<title>Bubble Bobble: Big 40!</title>',s,flags=re.S)
          if 'viewport-fit=cover' not in s:
              s=s.replace('width=device-width, user-scalable=no, initial-scale=1.0','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover')
          p.write_text(s)
          PY

      - name: Deploy exact Bubble Bobble mobile build to Netlify
        shell: bash
        run: |
          set -euxo pipefail
          npx --yes netlify-cli@latest deploy --allow-anonymous --dir=bobble40-live 2>&1 | tee netlify-output.txt
          URL=$(grep -Eo 'https://[-a-zA-Z0-9.]+\.netlify\.app' netlify-output.txt | tail -n 1)
          test -n "$URL"
          echo "$URL" > BOBBLE40_NETLIFY_URL.txt
          curl -L --fail --retry 5 "$URL" | grep -q 'Bubble Bobble: Big 40!'

      - name: Save live URL
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add BOBBLE40_NETLIFY_URL.txt
          git commit -m 'Save live Bubble Bobble mobile URL' || true
          git push origin HEAD:bobble40-build || true
