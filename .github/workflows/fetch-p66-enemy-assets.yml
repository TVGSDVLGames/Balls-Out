name: Fetch p66 Enemy Assets
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fetch-p66-enemy-assets.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch audited CC0 Quaternius character and animation assets
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Seyamalam/blood-league-kickoff.git src
          mkdir -p p66-assets/quaternius
          cp src/public/assets/vendor/quaternius/night-striker.glb p66-assets/quaternius/
          cp src/public/assets/vendor/quaternius/universal-animation-library.glb p66-assets/quaternius/
          cp src/public/assets/vendor/quaternius/LICENSE-ANIMATIONS.txt p66-assets/quaternius/
          cp src/public/assets/vendor/quaternius/LICENSE-BASE-CHARACTERS.txt p66-assets/quaternius/
          ls -lh p66-assets/quaternius
      - name: Upload p66 assets
        uses: actions/upload-artifact@v4
        with:
          name: balls-out-p66-enemy-assets
          path: p66-assets
          compression-level: 0
          retention-days: 1
