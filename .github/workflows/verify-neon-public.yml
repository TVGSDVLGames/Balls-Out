name: Verify Neon Millipede Public URL
on:
  push:
    branches: [neon-millipede-public]
    paths:
      - 'neon-live/**'
      - '.github/workflows/verify-neon-public.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public raw.githack site and assets
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://raw.githack.com/TVGSDVLGames/Balls-Out/neon-millipede-public'
          for n in {1..12}; do
            if curl -fLsS --max-time 30 "$BASE/neon-live/index.html" -o /tmp/index.html; then break; fi
            sleep 5
          done
          grep -q 'NEON' /tmp/index.html
          grep -q 'TAP TO PLAY' /tmp/index.html
          curl -fLsS --max-time 60 "$BASE/web/index.js" -o /tmp/index.js
          test -s /tmp/index.js
          curl -fLsS --max-time 180 "$BASE/web/index.wasm" -o /tmp/index.wasm
          test $(stat -c%s /tmp/index.wasm) -gt 30000000
          curl -fLsS --max-time 30 "$BASE/neon-millipede/pck.part00" -o /tmp/p0
          curl -fLsS --max-time 30 "$BASE/neon-millipede/pck.part01" -o /tmp/p1
          curl -fLsS --max-time 30 "$BASE/neon-millipede/pck.part02" -o /tmp/p2
          test -s /tmp/p0
          test -s /tmp/p1
          test -s /tmp/p2
          echo "PUBLIC_URL=$BASE/neon-live/index.html"
