<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Lab</title>
<style>html,body{margin:0;background:#070a0f;color:#dfe7ed;font:14px system-ui;height:100%}#s{display:grid;place-items:center;height:100%;text-align:center}.bar{width:min(420px,70vw);height:8px;border-radius:99px;background:#1b232b;overflow:hidden;margin:14px auto}.fill{height:100%;width:0;background:#79c7f5;transition:width .15s}</style></head>
<body><div id="s"><div><b>DM3AG Rhythm Lab</b><div>Loading instrument…</div><div class="bar"><div class="fill" id="f"></div></div><small id="m">0 / 23</small></div></div>
<script>(async()=>{try{let a=[];for(let i=0;i<23;i++){let n=String(i).padStart(3,'0');let r=await fetch('chunks/'+n+'.txt');if(!r.ok)throw new Error('chunk '+n+' '+r.status);a.push(await r.text());document.getElementById('f').style.width=((i+1)/23*100)+'%';document.getElementById('m').textContent=(i+1)+' / 23';}let h=a.join('');document.open();document.write(h);document.close();}catch(e){document.getElementById('s').innerHTML='<div><b>Load failed</b><br><pre>'+String(e)+'</pre></div>';}})();</script></body></html>
