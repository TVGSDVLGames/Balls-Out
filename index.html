<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Lab</title><body style="margin:0;background:#080b10;color:#d9e2e8;font:14px system-ui;display:grid;place-items:center;min-height:100vh"><div id="m">Loading Rhythm Lab…</div><script>(async()=>{try{const p=["p00.txt","p01.txt","p02.txt","p03.txt","p04.txt","p05.txt","p06.txt","p07.txt"];const r=await Promise.all(p.map(x=>fetch(x,{cache:"no-store"}).then(y=>{if(!y.ok)throw new Error(x+" "+y.status);return y.text()})));document.open();document.write(r.join(""));document.close()}catch(e){document.getElementById("m").textContent="Load failed: "+e.message;console.error(e)}})();</script>
