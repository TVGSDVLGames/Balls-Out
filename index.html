<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Lab</title><style>html,body{margin:0;background:#080b10;color:#d9e2e8;font:15px system-ui}#l{position:fixed;inset:0;display:grid;place-items:center}#b{width:min(420px,80vw)}#p{height:6px;background:#202833;border-radius:99px;overflow:hidden;margin-top:12px}#f{height:100%;width:0;background:#72c8ff}</style></head><body><div id="l"><div id="b">Loading Rhythm Lab…<div id="p"><div id="f"></div></div></div></div><script>(async()=>{const fs=["part000.txt","part001.txt","part002.txt","part003.txt","part004.txt","part005.txt","part006.txt","part007.txt","part008.txt","part009.txt","part010.txt","part011.txt","part012.txt","part013.txt","part014.txt","part015.txt","part016.txt"];let a=[];for(let i=0;i<fs.length;i++){const r=await fetch(fs[i]);if(!r.ok)throw Error(fs[i]+" "+r.status);a.push(await r.text());document.getElementById("f").style.width=((i+1)/fs.length*100)+"%"}const h=a.join("");document.open();document.write(h);document.close()})().catch(e=>document.getElementById("b").textContent="Load failed: "+e.message)</script></body></html>
