<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Cum Back King</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;touch-action:none;overscroll-behavior:none}body{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;outline:none}#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#050505;color:#fff;font:700 17px system-ui;z-index:20;text-align:center;padding:24px}#bar{width:min(360px,80vw);height:10px;border:1px solid #777;border-radius:10px;overflow:hidden}#fill{height:100%;width:0;background:#fff}#err{max-width:760px;white-space:pre-wrap;color:#ffb2b2;font-weight:600}</style></head><body><canvas id="canvas"></canvas><div id="status"><div id="msg">LOADING CUM BACK KING</div><div id="bar"><div id="fill"></div></div><div id="err"></div></div><script src="../web/index.js"></script><script>
const statusEl=document.getElementById('status'),msg=document.getElementById('msg'),fill=document.getElementById('fill'),err=document.getElementById('err');
function fail(e){console.error(e);msg.textContent='LOAD ERROR';err.textContent=String(e&&e.stack||e);fill.style.width='0%'}
async function loadPackedGame(){const parts=[];for(let i=0;i<1000;i++){const n=String(i).padStart(3,'0');const r=await fetch('../web/cbkdata/c'+n+'.txt',{cache:'no-store'});if(!r.ok){if(i===0)throw new Error('Cum Back King game data not found');break;}parts.push(await r.text());msg.textContent='LOADING GAME DATA';fill.style.width=Math.min(55,5+i*1.25)+'%';}const b64=parts.join('').replace(/\s+/g,'');const binary=atob(b64),gz=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)gz[i]=binary.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support gzip decompression.');msg.textContent='UNPACKING CUM BACK KING';fill.style.width='65%';const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).arrayBuffer();}
(async()=>{const pack=await loadPackedGame();msg.textContent='STARTING CUM BACK KING';fill.style.width='75%';const engine=new Engine({args:[],canvas:document.getElementById('canvas'),canvasResizePolicy:2,emscriptenPoolSize:8,executable:'../web/index',experimentalVK:false,focusCanvas:true,gdextensionLibs:[],godotPoolSize:4,fileSizes:{'../web/index.wasm':39513091}});await engine.preloadFile(pack,'cum-back-king.pck');fill.style.width='88%';await engine.start({args:['--main-pack','cum-back-king.pck']});fill.style.width='100%';statusEl.remove();})().catch(fail);
</script></body></html>
