<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Alesis Real Firmware Studio Phase 6</title><style>html,body{margin:0;background:#090a0b;color:#ddd;font-family:Arial,sans-serif;min-height:100%}#s{min-height:100vh;display:grid;place-items:center;text-align:center}#bar{width:min(420px,82vw);height:10px;background:#242424;border:1px solid #555;margin:14px auto 8px}#f{height:100%;width:0;background:#65bfdc}</style></head><body><div id="s"><div><b>Loading Phase 6 advanced-parity build…</b><div id="bar"><div id="f"></div></div><small id="m">Starting…</small></div></div><script>(async()=>{try{const baseTotal=23,parts=[];for(let i=0;i<baseTotal;i++){const n=String(i).padStart(3,'0'),r=await fetch('../alesis-real-firmware-phase3-all-machines/chunks/'+n+'.txt',{cache:'no-store'});if(!r.ok)throw Error('base '+n+' '+r.status);parts.push(await r.text());f.style.width=((i+1)/(baseTotal+5)*100)+'%';m.textContent='Base '+(i+1)+' / '+baseTotal}let patch='';for(let i=0;i<5;i++){const n=String(i).padStart(3,'0'),r=await fetch('patches/'+n+'.txt',{cache:'no-store'});if(!r.ok)throw Error('patch '+n+' '+r.status);patch+=await r.text();f.style.width=((baseTotal+i+1)/(baseTotal+5)*100)+'%';m.textContent='Patch '+(i+1)+' / 5'}let h=parts.join('');if(!h.toLowerCase().startsWith('<!doctype html>'))throw Error('base invalid');h=h.replace('</body></html>',patch+'\n</body></html>');document.open();document.write(h);document.close()}catch(e){s.innerHTML='<div><b>Load failed</b><br><pre>'+String(e)+'</pre></div>';console.error(e)}})();</script></body></html>
